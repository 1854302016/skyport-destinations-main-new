<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <linearGradient id="tfNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E3F"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="tfElectricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="tfSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <filter id="tfGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left Monogram Icon -->
  <g transform="translate(10, 8)">
    <!-- T top bar & stem -->
    <path d="M 12 18 L 78 18 L 72 32 L 56 32 L 48 68 C 42 58 35 50 26 44 L 38 32 L 12 32 Z" fill="url(#tfNavy)"/>
    <path d="M 28 32 L 72 32 L 68 44 L 46 44 L 41 66 C 36 58 31 52 26 48 Z" fill="#081E3F"/>

    <!-- Dynamic Swoosh / Flight arc -->
    <path d="M 8 72 C 14 62 26 56 38 64 C 54 74 76 56 102 18 L 105 20 C 76 64 52 84 34 76 C 22 70 14 74 8 82 Z" fill="url(#tfElectricBlue)" filter="url(#tfGlow)"/>

    <!-- F Wings and lower stem -->
    <path d="M 44 68 C 58 56 78 44 94 44 L 88 56 C 76 56 62 64 52 74 Z" fill="url(#tfElectricBlue)"/>
    <path d="M 40 76 C 46 90 44 104 36 112 C 48 108 54 94 56 80 C 66 84 76 80 84 72 L 80 82 C 72 88 62 92 52 88 C 50 98 46 108 34 116 C 30 118 24 118 22 114 C 20 106 24 94 30 84 C 26 84 18 88 12 92 C 14 84 20 78 28 76 C 32 76 36 76 40 76 Z" fill="url(#tfElectricBlue)"/>

    <!-- Airplane Taking Off -->
    <g transform="translate(94, 6) rotate(35) scale(0.95)">
      <!-- Fuselage -->
      <path d="M 0 0 L 26 -2 C 30 -2 33 0 34 3 C 33 6 30 8 26 8 L 0 6 L -6 12 L -9 12 L -6 4 L -6 -4 L -9 -4 L -6 0 Z" fill="#081E3F"/>
      <!-- Main Wings -->
      <path d="M 12 1 L 2 18 L 7 18 L 18 2 Z" fill="#081E3F"/>
      <path d="M 12 5 L 2 -12 L 7 -12 L 18 4 Z" fill="#081E3F"/>
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(135, 15)">
    <!-- TRUSTED FARE Main Title -->
    <text x="0" y="58" font-family="'Inter', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="4.5" fill="#081E3F">
      TRUSTED <tspan fill="#0066FF">FARE</tspan>
    </text>

    <!-- Subtitle Line & Tagline -->
    <g transform="translate(0, 78)">
      <!-- Left decorative line -->
      <line x1="2" y1="-5" x2="45" y2="-5" stroke="#081E3F" stroke-width="1.8" stroke-linecap="round"/>
      
      <!-- Tagline Text -->
      <text x="56" y="0" font-family="'Inter', 'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="11" letter-spacing="2.8" fill="#081E3F">
        TRUSTED JOURNEYS, BETTER FARES
      </text>
      
      <!-- Right decorative line -->
      <line x1="322" y1="-5" x2="365" y2="-5" stroke="#081E3F" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
